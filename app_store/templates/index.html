<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App发布看板</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--panel:#ffffff;--panel2:#f2f2f7;--line:rgba(0,0,0,.08);--hairline:#d2d2d7;--txt:#1d1d1f;--mut:#6e6e73;--acc:#0071e3;--btn-ink:#ffffff;--ok:#157034;--err:#d70015;--warn:#c93400;--hdr-bg:rgba(255,255,255,.72);--aside-bg:rgba(245,245,247,.85);--hov:rgba(0,0,0,.05);--hov2:rgba(0,0,0,.04);--btn2-bg:#ffffff;--btn2-hov:#f8f8fa;--chip-bg:#f2f2f7;--input-bg:#ffffff;--card-border:rgba(0,0,0,.06);--card-shadow:0 8px 24px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);--console-bg:#f8f8fa;--console-txt:#3a3a3c;--tint-ok:#e8f6ec;--tint-err:#fdeceb;--tint-warn:#fdf0e7;--tint-blue:#e8f1fd;--tint-gray:#f0f4f8;--pending-txt:#0066cc;--draft-txt:#43688c;--ov-bg:rgba(0,0,0,.4);--modal-border:rgba(0,0,0,.06);--modal-shadow:0 20px 60px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.08);--sb-thumb:rgba(0,0,0,.18);--sb-thumb-hov:rgba(0,0,0,.28);--sel:rgba(0,113,227,.18);--focus-ring:rgba(0,113,227,.35);--bdg-ok-bd:rgba(21,112,52,.45);--bdg-err-bd:rgba(215,0,21,.35)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f172a;--panel:#1e293b;--panel2:#294061;--line:#3b4a63;--hairline:#3b4a63;--txt:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--btn-ink:#0a1628;--ok:#4ade80;--err:#fca5a5;--warn:#fbbf24;--hdr-bg:rgba(20,33,58,.85);--aside-bg:rgba(13,22,38,.85);--hov:#22406b;--hov2:#1d3357;--btn2-bg:#23395e;--btn2-hov:#2c4a75;--chip-bg:#23395e;--input-bg:#0d1626;--card-border:#3b4a63;--card-shadow:0 8px 24px rgba(0,0,0,.35);--console-bg:#0a1322;--console-txt:#e2e8f0;--tint-ok:#14532d;--tint-err:#7f1d1d;--tint-warn:#78350f;--tint-blue:#1e4d6b;--tint-gray:#1e3a5f;--pending-txt:#7dd3fc;--draft-txt:#38bdf8;--ov-bg:rgba(2,6,23,.6);--modal-border:#3b4a63;--modal-shadow:0 20px 60px rgba(0,0,0,.5);--sb-thumb:rgba(148,163,184,.3);--sb-thumb-hov:rgba(148,163,184,.45);--sel:rgba(56,189,248,.25);--focus-ring:rgba(56,189,248,.45);--bdg-ok-bd:#4ade80;--bdg-err-bd:#fca5a5}
:root{--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--font-label:11px;--font-caption:12px;--font-body:13px;--font-title:14px;--font-header:17px;--font-app-name:20px;--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-pill:999px;--touch-min:32px;--modal-min-w:380px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background .3s ease,color .3s ease}
header,aside,.card,.modal,.result,.badge,.state{transition:background-color .3s ease,border-color .3s ease}
::selection{background:var(--sel)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:var(--radius-sm)}
::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-hov)}
::-webkit-scrollbar-track{background:transparent}
header{display:flex;align-items:center;justify-content:space-between;padding:10px var(--space-5);background:var(--hdr-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);min-height:52px;flex-shrink:0}
header h1{font-size:var(--font-header);font-weight:700;letter-spacing:-.02em;white-space:nowrap}
header .tag{color:var(--mut);font-size:var(--font-caption);margin-left:var(--space-2)}
.hdr-right{display:flex;gap:var(--space-2);align-items:center}
button{background:var(--acc);color:var(--btn-ink);border:none;border-radius:var(--radius-pill);padding:8px var(--space-4);font-size:var(--font-body);font-weight:600;min-height:var(--touch-min);cursor:pointer;transition:transform .25s cubic-bezier(.25,1,.5,1),filter .2s ease}
button:hover{filter:brightness(1.06)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus-ring)}
button.secondary{background:var(--btn2-bg);color:var(--txt);border:1px solid var(--hairline)}
button.secondary:hover{background:var(--btn2-hov);filter:none}
button.sm{padding:5px var(--space-3);font-size:var(--font-caption);min-height:24px}
.layout{display:flex;flex:1;overflow:hidden}
aside{width:230px;flex-shrink:0;background:var(--aside-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-right:1px solid var(--line);padding:var(--space-3) var(--space-2);overflow-y:auto}
aside .cat-title{font-size:var(--font-label);color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:var(--space-3) var(--space-1) var(--space-2);font-weight:600}
aside .app-item{display:flex;align-items:center;gap:var(--space-2);padding:8px var(--space-2);border-radius:var(--radius-md);cursor:pointer;font-size:var(--font-body);color:var(--txt);margin-bottom:var(--space-1);transition:background .2s ease}
aside .app-item:hover{background:var(--hov)}
aside .app-item.active{background:var(--acc);color:var(--btn-ink);font-weight:600}
aside .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
main{flex:1;overflow-y:auto;padding:var(--space-4) var(--space-5) 40px;background:var(--bg)}
.app-head{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.app-head h2{font-size:var(--font-app-name);letter-spacing:-.02em}
.badge{background:var(--chip-bg);border:1px solid var(--line);border-radius:var(--radius-pill);padding:3px 10px;font-size:var(--font-caption);color:var(--txt)}
.badge.ok{color:var(--ok);border-color:var(--bdg-ok-bd);background:var(--tint-ok)}
.badge.err{color:var(--err);border-color:var(--bdg-err-bd);background:var(--tint-err)}
.mini-btn{background:var(--acc);color:var(--btn-ink);border:none;border-radius:var(--radius-pill);padding:5px var(--space-3);font-size:var(--font-caption);min-height:24px;cursor:pointer;font-weight:600;transition:transform .25s cubic-bezier(.25,1,.5,1),filter .2s ease}
.mini-btn:hover{filter:brightness(1.08)}
.mini-btn:active{transform:scale(.96)}
.scroll{display:block;margin-top:var(--space-4)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--space-3)}
.card{background:var(--panel);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);box-shadow:var(--card-shadow)}
.card h3{font-size:var(--font-title);color:var(--acc);margin-bottom:var(--space-2);font-weight:600;letter-spacing:-.01em}
.card .row{display:flex;justify-content:space-between;padding:var(--space-1) 0;font-size:var(--font-body);border-bottom:1px solid var(--line)}
.card .row:last-child{border:none}
.k{color:var(--mut)}
.v{color:var(--txt);max-width:65%;text-align:right;word-break:break-all}
.input-row{display:flex;gap:var(--space-2);margin-bottom:var(--space-2);align-items:center}
.input-row input{flex:1;background:var(--input-bg);color:var(--txt);border:1px solid var(--hairline);border-radius:var(--radius-md);padding:7px 10px;font-size:var(--font-body);min-width:0}
input,select,textarea{background:var(--input-bg);color:var(--txt);border:1px solid var(--hairline);border-radius:var(--radius-md);padding:7px 10px;font-size:var(--font-body);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--focus-ring)}
input[type=datetime-local]{background:var(--input-bg);color:var(--txt);border:1px solid var(--hairline);border-radius:var(--radius-md);padding:6px 10px;font-size:var(--font-body);font-weight:500;min-height:32px;-webkit-appearance:none;appearance:none}
input[type=datetime-local]::-webkit-calendar-picker-indicator{cursor:pointer;padding:4px}
textarea{min-height:48px;resize:vertical}
form-row{display:flex;gap:10px}
form-row>*{flex:1}
label{display:block;color:var(--mut);font-size:var(--font-label);margin:var(--space-2) 0 var(--space-1)}
.check{display:flex;align-items:center;gap:var(--space-2);margin:var(--space-3) 0;font-size:var(--font-body);color:var(--txt)}
.check input{width:16px;height:16px;accent-color:var(--acc);margin:0}
.actions{display:flex;gap:var(--space-2);margin:var(--space-3) 0}
.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-3)}
.state{display:inline-block;padding:3px var(--space-2);border-radius:var(--radius-sm);font-size:var(--font-caption);font-weight:600}
.state.published{background:var(--tint-ok);color:var(--ok)}
.state.reviewing{background:var(--tint-warn);color:var(--warn)}
.state.pending{background:var(--tint-blue);color:var(--pending-txt)}
.state.draft,.state.submitted{background:var(--tint-gray);color:var(--draft-txt)}
.state.rejected{background:var(--tint-err);color:var(--err)}
.state.unknown{background:var(--chip-bg);color:var(--mut)}
.state.killed{background:var(--tint-gray);color:var(--draft-txt)}
.result{background:var(--console-bg);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:var(--font-caption);line-height:1.6;max-height:220px;overflow-y:auto;color:var(--console-txt)}
.result div{white-space:pre-wrap;word-break:break-all}
.result .ok{color:var(--ok)}
.result .err{color:var(--err)}
.hide{display:none}
.muted{color:var(--mut);font-size:var(--font-caption)}
#tsteps{font-size:var(--font-caption);max-height:130px;overflow-y:auto;margin-top:var(--space-2);color:var(--txt)}
#tsteps div{padding:2px 0;display:flex;align-items:center;gap:var(--space-2)}
#tsteps div .icon{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:20px}
#tsteps div .icon.ok{color:var(--ok)}
#tsteps div .icon.err{color:var(--err)}
#tsteps div .icon.cur{color:var(--acc);animation:pulse-icon 1s infinite}
@keyframes pulse-icon{0%,100%{opacity:1}50%{opacity:.4}}
#tinfo{font-size:var(--font-title);font-weight:600;margin-bottom:var(--space-1)}
#tstage{font-size:var(--font-body);color:var(--acc);margin:var(--space-1) 0}
#tmeta{display:flex;gap:var(--space-2);flex-wrap:wrap;font-size:var(--font-caption);color:var(--mut);margin-bottom:var(--space-1)}
#tmeta .tlabel{color:var(--mut);align-self:center;margin-right:var(--space-1)}
#tmeta .platform-chip{background:var(--chip-bg);border-radius:var(--radius-pill);padding:3px 10px;display:inline-flex;align-items:center;gap:var(--space-1);cursor:pointer;user-select:none;border:1px solid transparent;transition:box-shadow .15s,border-color .15s}
#tmeta .platform-chip:hover{border-color:var(--acc)}
#tmeta .platform-chip.ok{background:var(--tint-ok);color:var(--ok)}
#tmeta .platform-chip.err{background:var(--tint-err);color:var(--err)}
#tmeta .platform-chip.run{background:var(--tint-blue);color:var(--pending-txt)}
#tmeta .platform-chip.sel{box-shadow:0 0 0 2px var(--acc);border-color:var(--acc)}
.overlay{position:fixed;inset:0;background:var(--ov-bg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:60}
.modal{background:var(--panel);border:1px solid var(--modal-border);border-radius:var(--radius-lg);padding:var(--space-4);min-width:min(var(--modal-min-w),92vw);max-width:90vw;max-height:70vh;overflow-y:auto;box-shadow:var(--modal-shadow)}
.file-item{padding:var(--space-2) var(--space-1);border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:var(--space-3);font-size:var(--font-body)}
.file-item:hover{background:var(--hov2)}
.file-item .fname{flex:1}
@media(max-width:760px){.layout{flex-direction:column}aside{width:100%;max-height:200px;padding:var(--space-2) var(--space-3)}header{flex-wrap:wrap;row-gap:var(--space-2);padding:10px var(--space-3)}header .muted{display:none}.hdr-right{margin-left:auto}main{padding:var(--space-3) var(--space-3) 24px}.grid{grid-template-columns:1fr}.plat-grid{grid-template-columns:1fr}.modal{max-width:94vw}}
.plat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-2) var(--space-3)}
.plat-item{display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-body);padding:var(--space-1) var(--space-2);background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-md);cursor:pointer}
.plat-item input{width:16px;height:16px;accent-color:var(--acc);margin:0}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2)}
.row-between.start{align-items:flex-start}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
.l10n-tabs{display:flex;gap:var(--space-1);margin:var(--space-1) 0 var(--space-2)}
.l10n-tabs .active{background:var(--acc);color:var(--btn-ink);border-color:transparent}
.l10n-tabs .l10n-tab.active:hover{background:var(--acc);filter:none}
.section-title{font-size:var(--font-title);color:var(--acc);font-weight:600;letter-spacing:-.01em}
.eyebrow{font-size:var(--font-label);color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.card.dense{padding:var(--space-2) var(--space-3);margin-bottom:var(--space-2)}
.modal-body{overflow:auto;flex:1;min-height:0}
.bundle-table{min-width:560px}
.icon-svg{width:12px;height:12px;flex-shrink:0;vertical-align:-2px}
#tsteps .icon-svg{width:14px;height:14px}
a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(pointer:coarse){button,button.sm,.mini-btn{min-height:44px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:var(--space-3)"><h1>App发布看板</h1><span class="muted" id="cfg"></span></div>
  <div class=hdr-right><span class="muted" id="fsInfo"></span><span class="muted" id="meInfo"></span><button class="secondary sm hide" id="logoutBtn" onclick="logout()">退出登录</button><button class="secondary sm" id="themeBtn" onclick="toggleTheme()">深色</button><button class=secondary sm onclick=ld()>刷新</button><button class=secondary sm onclick=validateAll()>校验凭证</button></div>
</header>
<div class=layout>
  <aside id=sb></aside>
  <main>
    <div id=appc><!-- 应用详情+发布表单 --></div>
    <div id=progress class=hide><div class=card>
      <div class="row-between start"><div><b class="section-title" id="tinfo"></b><div id="tmeta"></div></div><div style="display:flex;gap:var(--space-2)"><button class="secondary sm" id="tstop" onclick="confirmStopTask()" style="display:none;color:var(--err)">停止发布</button><button class="secondary sm" onclick="stopPoll()" id="tclose" style="display:none">×</button></div></div>
      <div id="tstage" aria-live="polite"></div>
      <div id="tup" aria-live="polite" style="font-size:var(--font-caption);color:var(--acc);margin-top:var(--space-1);min-height:16px"></div>
      <div id=tsteps></div>
    </div></div>
    <div class=scroll>
      <div id="sgSection" style="display:none"><div class="section-head"><h3 class="section-title">平台状态</h3><button class="secondary sm hide" id="shareBtn" onclick="shareStatus()"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>分享</button></div><div id="sg" class="status-grid"></div></div>
      <div><div class="section-head"><h3 class="section-title" id="histTitle">发布历史</h3><button class="secondary sm" id="histMoreBtn" onclick="showHistoryModal()">更多</button></div><div id="sh"><div class="muted">暂无发布记录</div></div></div>
      <div><h3 class="section-title" style="margin-bottom:var(--space-2)">日志</h3><div id="lg" class="result" role="log"><div>就绪</div></div></div>
    </div>
  </main>
</div>
<div id="toast" class="overlay" role="status" aria-live="polite" style="display:none"></div>
<script>
var ST={apps:[],cats:[],cur:null,plt:[],POLL:null,l10nNotes:{zh:"",en:""},l10nLang:"zh"};
function $(v){return document.getElementById(v)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function iconSvg(n){var P={check:'<polyline points="20 6 9 17 4 12"/>',cross:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',bolt:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',upload:'<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',warn:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',sun:'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'};return '<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(P[n]||"")+"</svg>"}
function api(p,o){return fetch(p,o).then(function(r){if(r.status===401)showLogin();return r.json().catch(function(){return{}})})}
// ==== 登录/会话（board.json 配置 users 后开启；viewer 只读，admin 可发布） ====
function showLogin(){if(document.getElementById("loginOverlay"))return;
var h='<div class="overlay" id="loginOverlay"><div class="modal" style="text-align:center;--modal-min-w:360px">'
+'<h3 class="section-title" style="margin-bottom:var(--space-3)">App发布看板</h3>'
+'<div style="text-align:left"><label for="lgUser">用户名</label><input id="lgUser" autocomplete="username"></div>'
+'<div style="text-align:left;margin-top:var(--space-2)"><label for="lgPass">密码</label><input id="lgPass" type="password" autocomplete="current-password"></div>'
+'<div id="lgErr" style="color:var(--err);font-size:var(--font-caption);min-height:18px;margin-top:var(--space-2)"></div>'
+'<button id="lgBtn" onclick="doLogin()" style="width:100%">登 录</button>'
var d=document.createElement("div");d.innerHTML=h;document.body.appendChild(d.firstElementChild);
var u=$("lgUser"),pw=$("lgPass");
[u,pw].forEach(function(el){el.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()})});
setTimeout(function(){u&&u.focus()},50)}
function doLogin(){var u=$("lgUser"),pw=$("lgPass"),b=$("lgBtn"),err=$("lgErr");
if(!u.value.trim()||!pw.value){err.textContent="请输入用户名和密码";return}
b.disabled=true;err.textContent="";
api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value.trim(),password:pw.value})}).then(function(r){
if(r&&r.ok){location.reload()}else{b.disabled=false;err.textContent=(r&&r.error)||"登录失败"}}).catch(function(){b.disabled=false;err.textContent="网络错误"}) }
function logout(){api("/api/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(){location.reload()})}
function isAdmin(){return !(ST.ME&&ST.ME.role==="viewer")}
function renderMeBox(){var m=$("meInfo"),lo=$("logoutBtn"),fs=$("fsInfo");if(!m)return;
var me=ST.ME||{};
